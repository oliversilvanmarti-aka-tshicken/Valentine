<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Delia ❤️</title>
    <style>
        body {
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .header_text {
            font-size: 2.2rem;
            color: #d63384;
            margin-bottom: 20px;
        }

        .gif_container img {
            width: 250px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 15px rgba(214, 51, 132, 0.2);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #yesButton {
            background-color: #ff4d6d;
            color: white;
        }

        #noButton {
            background-color: #adb5bd;
            color: white;
        }

        .chicken-heart {
            font-size: 4rem;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="content" class="container">
        <div class="gif_container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaHV4YXN3emh6bmR4bmx4bmx4bmx4bmx4bmx4bmx4bmx4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/c76IJLufpNwSULPk2m/giphy.gif" alt="Cute bear">
        </div>
        <h1 class="header_text">Delia, will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="celebrate()">Yes</button>
            <button class="btn" id="noButton" onclick="celebrate()">No</button>
        </div>
    </div>

    <script>
        function celebrate() {
            document.getElementById('content').innerHTML = `
                <h1 class="header_text">I knew you'd say yes, Delia! 😍</h1>
                <div class="gif_container">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaHV4YXN3emh6bmR4bmx4bmx4bmx4bmx4bmx4bmx4bmx4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/K9UIloRsuh280/giphy.gif">
                </div>
                <div class="chicken-heart">🐥❤️</div>
                <p style="color: #ff4d6d; font-size: 1.4rem; font-weight: bold; margin-top: 10px;">
                    Your Tshicken loves you!
                </p>
            `;
        }
    </script>
</body>
</html>
