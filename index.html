<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Delia ❤️</title>
    <style>
        body {
            background-color: #fff0f3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .header_text {
            font-size: 2.8rem;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 20px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .gif_container img {
            width: 280px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.2);
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesButton {
            background-color: #ff4d6d;
            color: white;
            z-index: 999; /* Ensure it stays on top as it grows */
        }

        #noButton {
            background-color: #adb5bd;
            color: white;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif_container">
            <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpwaHV4YXN3emh6bmR4bmx4bmx4bmx4bmx4bmx4bmx4bmx4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/c76IJLufpNwSULPk2m/giphy.gif" alt="Cute bear">
        </div>
        <h1 class="header_text">Delia, will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button class="btn" id="yesButton" onclick="handleYes()">Yes</button>
            <button class="btn" id="noButton" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        const messages = [
            "Wait, what?",
            "Delia, please? 🥺",
            "Are you sure??",
            "Really sure??",
            "Think again!",
            "I'll be so sad...",
            "Give it a chance!",
            "Is that your final answer?",
            "You're breaking my heart!",
            "Just click Yes already! ❤️"
        ];

        let messageIndex = 0;

        function moveButton() {
            const noBtn = document.getElementById('noButton');
            const yesBtn = document.getElementById('yesButton');
            
            // Move the "No" button randomly
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = `${Math.max(0, x)}px`;
            noBtn.style.top = `${Math.max(0, y)}px`;

            // Update text and grow the "Yes" button
            noBtn.innerText = messages[messageIndex];
            messageIndex = (messageIndex + 1) % messages.length;
            
            const currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = `${currentSize * 1.3}px`;
            yesBtn.style.padding = `${currentSize * 0.7}px ${currentSize * 1.4}px`;
        }

        function handleYes() {
            document.querySelector('.container').innerHTML = `
                <h1 class="header_text">I knew you'd say yes, Delia! 😍
